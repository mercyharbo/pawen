[build]
  command = "pnpm build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10.29.3"
  # Public links, identifiers, and environment names are not credentials.
  # Keep access tokens and API keys covered by secret scanning.
  SECRETS_SCAN_OMIT_KEYS = "CONTENTFUL_ENVIRONMENT,SELAR_TICKETS_URL,JOTFORM_FORM_ID,JOTFORM_NOMINATIONS_URL,NEXT_PUBLIC_SITE_URL"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Preview metadata must point to the preview, not the production Vercel site.
[context.deploy-preview]
  command = 'NEXT_PUBLIC_SITE_URL="$DEPLOY_PRIME_URL" pnpm build'

[context.branch-deploy]
  command = 'NEXT_PUBLIC_SITE_URL="$DEPLOY_PRIME_URL" pnpm build'
